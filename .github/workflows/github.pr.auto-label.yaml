name: GitHub PR - Auto Label


on:
  workflow_call:
    inputs:
      runs_on:
        description: >
          JSON-encoded runs-on value.
          Examples:
          - '"ubuntu-latest"'
          - '["self-hosted","linux","x64"]'
        required: false
        type: string
        default: '"ubuntu-latest"'

      labeler_enabled:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether enabled `labeler`. Defaults to `true`."
      labeler_config_file:
        type: string
        required: false
        default: ".github/labeler.yaml"
        description: "(Optional) The path to the `labeler` config file. Defaults to `.github/labeler.yaml`."
      labeler_sync_labels:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether or not to remove labels when matching files are reverted or no longer changed by the PR. Defaults to `true`."
      labeler_dot_included:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether to auto-include paths starting with dot (e.g. `.github`). Defaults to `true`."
      labeler_pr_numbers:
        type: string
        required: false
        description: "(Optional) The number(s) of pull request to update, rather than detecting from the workflow context. In normal usage, the pr-number input is not required as the action will detect the PR number from the workflow context."
      pr_size_enabled:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether enabled `pr-size-labeler`. Defaults to `true`."
      pr_size_config_file:
        type: string
        required: false
        description: "(Optional) Repository-relative config path at the PR base commit. When omitted, tries `.github/size-labeler.yaml`, then `.github/size-labeler.yml`. File settings override pr_size inputs."
      pr_size_overwrite_other_size_labels:
        type: boolean
        required: false
        default: false
        description: "(Optional) Also remove other labels matching pr_size_label_prefix. The five configured size labels are always managed by name. Defaults to `false`."
      pr_size_label_prefix:
        type: string
        required: false
        default: "size/"
        description: "(Optional) Prefix identifying other size labels when overwrite is enabled. Defaults to `size/`."
      pr_size_files_to_ignore:
        type: string
        required: false
        description: "(Optional) Whitespace-separated glob patterns excluded from size calculations."
      pr_size_ignore_file_deletions:
        type: boolean
        required: false
        default: true
        description: "(Optional) Exclude completely removed files. Defaults to `true`."
      pr_size_ignore_line_deletions:
        type: boolean
        required: false
        default: false
        description: "(Optional) Count additions only. Defaults to `false`."
      pr_size_fail_if_xl:
        type: boolean
        required: false
        default: false
        description: "(Optional) Fail after labeling an XL PR. Defaults to `false`."
      pr_size_message_if_xl:
        type: string
        required: false
        default: "This PR has too many changes. Please make sure you are NOT addressing multiple issues with one PR."
        description: "(Optional) Sticky comment for XL PRs. Set to an empty string to disable."
      pr_size_dry_run:
        type: boolean
        required: false
        default: false
        description: "(Optional) Calculate size without modifying labels/comments or enforcing XL failure. Defaults to `false`."
      pr_size_xs_label:
        type: string
        required: false
        default: "size/XS"
        description: "(Optional) A label for very small-sized PRs. Defaults to `size/XS`."
      pr_size_xs_max:
        type: number
        required: false
        default: 15
        description: "(Optional) Exclusive upper bound for XS-sized PRs. Defaults to `15`."
      pr_size_s_label:
        type: string
        required: false
        default: "size/S"
        description: "(Optional) A label for small-sized PRs. Defaults to `size/S`."
      pr_size_s_max:
        type: number
        required: false
        default: 100
        description: "(Optional) Exclusive upper bound for S-sized PRs. Defaults to `100`."
      pr_size_m_label:
        type: string
        required: false
        default: "size/M"
        description: "(Optional) A label for medium-sized PRs. Defaults to `size/M`."
      pr_size_m_max:
        type: number
        required: false
        default: 500
        description: "(Optional) Exclusive upper bound for M-sized PRs. Defaults to `500`."
      pr_size_l_label:
        type: string
        required: false
        default: "size/L"
        description: "(Optional) A label for large-sized PRs. Defaults to `size/L`."
      pr_size_l_max:
        type: number
        required: false
        default: 1000
        description: "(Optional) Exclusive upper bound for L-sized PRs. Defaults to `1000`."
      pr_size_xl_label:
        type: string
        required: false
        default: "size/XL"
        description: "(Optional) Label for PRs at or above `pr_size_l_max`. Defaults to `size/XL`."

    secrets:
      token:
        required: false
        description: "(Optional) The GitHub API token to use when communicating with GitHub API."

    outputs:
      labeler_new_labels:
        value: ${{ jobs.labeler.outputs.new_labels }}
        description: "A comma-separated list of all new labels."
      labeler_all_labels:
        value: ${{ jobs.labeler.outputs.all_labels }}
        description: "A comma-separated list of all labels that the PR contains."
      pr_size_label:
        value: ${{ jobs.pr-size-labeler.outputs.label }}
        description: "The calculated size label."
      pr_size_changed_lines:
        value: ${{ jobs.pr-size-labeler.outputs.changed_lines }}
        description: "Included changed lines; a lower bound if pr_size_count_complete is false."
      pr_size_count_complete:
        value: ${{ jobs.pr-size-labeler.outputs.count_complete }}
        description: "Whether all changed files were counted."


jobs:
  labeler:
    name: Add labels by Labeler
    runs-on: ${{ fromJson(inputs.runs_on) }}
    if: ${{ inputs.labeler_enabled }}

    steps:
    - name: Add Labels by Labeler
      id: auto-label
      uses: actions/labeler@v7
      with:
        repo-token: ${{ secrets.token }}
        configuration-path: ${{ inputs.labeler_config_file }}
        sync-labels: ${{ inputs.labeler_sync_labels }}
        dot: ${{ inputs.labeler_dot_included }}
        pr-number: ${{ inputs.labeler_pr_numbers }}

    outputs:
      new_labels: ${{ steps.auto-label.outputs.new-labels }}
      all_labels: ${{ steps.auto-label.outputs.all-labels }}


  pr-size-labeler:
    name: Add labels by PR Size Labeler
    runs-on: ${{ fromJson(inputs.runs_on) }}
    if: ${{ inputs.pr_size_enabled }}

    outputs:
      label: ${{ steps.size-labeler.outputs.label }}
      changed_lines: ${{ steps.size-labeler.outputs.changed_lines }}
      count_complete: ${{ steps.size-labeler.outputs.count_complete }}

    steps:
    - name: Add PR Size Labels for PR
      id: size-labeler
      uses: tedilabs/github-actions/.github/actions/github.pr.size-labeler@main
      with:
        GITHUB_TOKEN: ${{ secrets.token }}
        config_file: ${{ inputs.pr_size_config_file }}
        overwrite_other_size_labels: ${{ inputs.pr_size_overwrite_other_size_labels }}
        size_label_prefix: ${{ inputs.pr_size_label_prefix }}
        files_to_ignore: ${{ inputs.pr_size_files_to_ignore }}
        dry_run: ${{ inputs.pr_size_dry_run }}
        xs_label: ${{ inputs.pr_size_xs_label }}
        xs_max_size: ${{ inputs.pr_size_xs_max }}
        s_label: ${{ inputs.pr_size_s_label }}
        s_max_size: ${{ inputs.pr_size_s_max }}
        m_label: ${{ inputs.pr_size_m_label }}
        m_max_size: ${{ inputs.pr_size_m_max }}
        l_label: ${{ inputs.pr_size_l_label }}
        l_max_size: ${{ inputs.pr_size_l_max }}
        xl_label: ${{ inputs.pr_size_xl_label }}
        fail_if_xl: ${{ inputs.pr_size_fail_if_xl }}
        message_if_xl: ${{ inputs.pr_size_message_if_xl }}
        ignore_line_deletions: ${{ inputs.pr_size_ignore_line_deletions }}
        ignore_file_deletions: ${{ inputs.pr_size_ignore_file_deletions }}

