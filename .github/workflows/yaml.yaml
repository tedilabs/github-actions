name: Integration - YAML


on:
  push:
    branches:
    - main
    paths:
    - "**.yaml"
    - "**.yml"

  pull_request:
    paths:
    - "**.yaml"
    - "**.yml"

  workflow_dispatch: {}


concurrency:
  group: integration-yaml-${{ github.ref }}
  cancel-in-progress: true


jobs:
  integration:
    name: Integration
    uses: tedilabs/github-actions/.github/workflows/yaml.integration.yaml@main

    permissions:
      contents: read
      pull-requests: write
