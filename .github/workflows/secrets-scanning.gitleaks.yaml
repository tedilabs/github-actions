name: Secrets Scanning - Gitleaks


on:
  workflow_call:
    inputs:
      runs_on:
        description: >
          JSON-encoded runs-on value.
          Examples:
          - '"ubuntu-latest"'
          - '["self-hosted","linux","x64"]'
        required: false
        type: string
        default: '"ubuntu-latest"'

      gitleaks_version:
        type: string
        required: false
        default: 8.30.1
        description: "(Optional) The Gitleaks version to install with mise (aqua backend), e.g. `8.21.2` or `latest`. Note: no `v` prefix."
      gitleaks_extra_args:
        type: string
        required: false
        default: ""
        description: "(Optional) Extra CLI arguments forwarded to `gitleaks git` (e.g. `--config gitleaks.toml`). Empty by default."
      git_ref:
        type: string
        required: false
        default: ""
        description: "(Optional) The target ref (branch, tag, or SHA) to scan. Only honored on `workflow_dispatch`, where the whole history of this ref is scanned. When empty, defaults to the ref the workflow runs on. Ignored on `push` and `pull_request`, where the scope is derived from the event payload."
      path:
        type: string
        required: false
        default: ./
        description: "(Optional) The path of the git repository that Gitleaks scans. Defaults to `./`, the repository root."


jobs:
  scanning:
    name: Scan for Leaked Secrets with Gitleaks
    if: >
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ${{ fromJson(inputs.runs_on) }}

    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.git_ref }}
        # Full history is required to diff against the base commit (`push`, `pull_request`) and to walk the entire ref (`workflow_dispatch`).
        fetch-depth: 0

    - name: Setup tools with mise
      id: setup-tools
      uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        tool_versions: |
          gitleaks ${{ inputs.gitleaks_version }}

    - name: Resolve scan scope
      id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        log_opts=""

        case "${EVENT_NAME}" in
          push)
            # Diff the pushed range. On the first push to a new branch `before`
            # is all-zeroes, so leave it empty to scan the whole history.
            if [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
            ;;
          pull_request)
            # Diff the base branch against the PR head.
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            ;;
          *)
            # workflow_dispatch (and any fallback): full history of the target ref.
            log_opts=""
            ;;
        esac

        echo "log_opts=${log_opts}" >> "${GITHUB_OUTPUT}"
        echo "Scan scope for '${EVENT_NAME}': log_opts='${log_opts:-<full history>}'"

    # Primary scan: writes a JSON report to a file and fails the job
    # (`--exit-code 1`) when secrets are found.
    - name: Scan for leaked secrets
      id: scan
      continue-on-error: true
      env:
        SCAN_PATH: ${{ inputs.path }}
        LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
        EXTRA_ARGS: ${{ inputs.gitleaks_extra_args }}
      run: |
        set -euo pipefail

        repo_dir="$(cd "${SCAN_PATH}" && pwd)"

        scan_args=(git "${repo_dir}" --report-format json --report-path results.json --redact --no-banner --exit-code 1)
        # Preserve whitespace-separated CLI arguments without unquoted expansion,
        # which could also expand glob characters in the workspace.
        read -r -a extra_args <<< "${EXTRA_ARGS}"
        [ -n "${LOG_OPTS}" ] && scan_args+=(--log-opts "${LOG_OPTS}")

        echo "Running: gitleaks ${scan_args[*]} ${EXTRA_ARGS}"
        set +e
        gitleaks "${scan_args[@]}" "${extra_args[@]}"
        scan_exit_code="$?"
        set -e

        echo "exit_code=${scan_exit_code}" >> "${GITHUB_OUTPUT}"
        exit "${scan_exit_code}"

    # A non-zero exit can mean either detected secrets or a scanner error.
    # Classify the JSON report and build the appropriate result message.
    - name: Classify scan result
      id: report
      if: ${{ steps.scan.outcome == 'failure' }}
      env:
        LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
      run: |
        set -euo pipefail

        count="$(jq 'length' results.json 2>/dev/null || echo 0)"

        if [ "${count}" -gt 0 ]; then
          echo "outcome=secrets" >> "${GITHUB_OUTPUT}"
          {
            echo "## 🔑 Gitleaks Secret Scan"
            echo ""
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Scope:** \`${LOG_OPTS:-<full history>}\`"
            echo ""
            echo "❌ **${count} secret(s) detected.** Revoke/rotate any real credential immediately and remove it from history."
            echo ""
            echo "| Rule | Description | File | Line | Commit |"
            echo "| --- | --- | --- | --: | --- |"
            # `--redact` keeps the raw secret out of the report; only metadata is
            # rendered into the summary and the PR comment.
            jq -r '
              .[] | "| " + .RuleID
              + " | " + (.Description // "-")
              + " | " + (.File // "-")
              + " | " + ((.StartLine // 0) | tostring)
              + " | " + ((.Commit // "-")[0:10])
              + " |"
            ' results.json
          } > report.md
        else
          echo "outcome=scanner_error" >> "${GITHUB_OUTPUT}"
          {
            echo "## ⚠️ Secret Scanning Error"
            echo ""
            echo "An unknown error occurred while running Secret Scanning. Please contact the Infrastructure Team."
            echo ""
            echo "This is a scanner error, not a confirmed secret leak, so you may merge this pull request first."
            echo ""
            echo "- **Scanner exit code:** \`${{ steps.scan.outputs.exit_code }}\`"
          } > report.md
        fi

        cat report.md >> "${GITHUB_STEP_SUMMARY}"

        {
          echo "report<<REPORT_EOF"
          cat report.md
          echo "REPORT_EOF"
        } >> "${GITHUB_OUTPUT}"

        # Inline annotations surfaced on the PR diff, emitted from the report.
        if [ "${count}" -ne 0 ]; then
          jq -r '
            .[] | "::error file=" + (.File // "")
            + ",line=" + ((.StartLine // 0) | tostring)
            + "::" + .RuleID + " - " + (.Description // "potential secret")
          ' results.json
        fi

    - name: Comment scan result on the pull request
      id: github-pr-comment
      if: ${{ steps.report.conclusion == 'success' && github.event_name == 'pull_request' }}
      uses: tedilabs/github-actions/.github/actions/github.pr.sticky-comment@main
      with:
        marker: gitleaks-secret-scan
        body: ${{ steps.report.outputs.report }}

    - name: Fail when secrets are detected
      if: ${{ steps.report.outputs.outcome == 'secrets' }}
      run: exit 1

    # Clean run (no secrets): report to the job summary only, no PR comment.
    - name: Report no secrets detected
      if: ${{ steps.scan.outcome == 'success' }}
      env:
        LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
      run: |-
        set -euo pipefail

        {
          echo "## 🔑 Gitleaks Secret Scan"
          echo ""
          echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
          echo "- **Scope:** \`${LOG_OPTS:-<full history>}\`"
          echo ""
          echo "✅ **No secrets detected.**"
        } >> "${GITHUB_STEP_SUMMARY}"
