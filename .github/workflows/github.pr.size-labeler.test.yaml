name: Test - PR Size Labeler


on:
  pull_request:
    paths:
    - .github/actions/github.pr.size-labeler/**
    - .github/workflows/github.pr.size-labeler.test.yaml
    - .github/workflows/github.pr.auto-label.yaml
  push:
    branches:
    - main
    paths:
    - .github/actions/github.pr.size-labeler/**
    - .github/workflows/github.pr.size-labeler.test.yaml
    - .github/workflows/github.pr.auto-label.yaml
  workflow_dispatch: {}


permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .github/actions/github.pr.size-labeler

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        version: "0.13.2"
        python-version: "3.12"
        enable-cache: false

    - name: Test Locked Dependencies
      run: |
        uv export --no-config --locked --script size_labeler.py --format requirements-txt --no-hashes --output-file "$RUNNER_TEMP/size-labeler-test-requirements.txt"
        uv run --no-config --no-project --python 3.12 --with-requirements "$RUNNER_TEMP/size-labeler-test-requirements.txt" python -m unittest discover -s tests -v

    - name: Smoke Test Composite Action
      id: smoke
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/github.pr.size-labeler
      with:
        dry_run: "true"

    - name: Check Smoke Test Outputs
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        SIZE: ${{ steps.smoke.outputs.size }}
        DRY_RUN: ${{ steps.smoke.outputs.dry_run }}
      run: |
        test "$DRY_RUN" = true
        case "$SIZE" in
          xs|s|m|l|xl) ;;
          *) exit 1 ;;
        esac
