name: Terraform Modules - Integration


on:
  workflow_call:
    inputs:
      runs_on:
        description: >
          JSON-encoded runs-on value.
          Examples:
          - '"ubuntu-latest"'
          - '["self-hosted","linux","x64"]'
        required: false
        type: string
        default: '"ubuntu-latest"'

      paths:
        type: string
        required: false
        default: |
          modules/**
          examples/**
        description: "(Optional) File and directory patterns used to detect changed Terraform directories, one per line. Defaults to `modules/**` and `examples/**`."
      paths_max_depth:
        type: string
        required: false
        default: "2"
        description: "(Optional) The maximum depth of the changed directories to check. For example, `modules/foo/bar.tf` with a max depth of `2` is checked as `modules/foo`. Defaults to `2`."

      terraform_host:
        type: string
        required: false
        default: app.terraform.io
        description: "(Optional) The hostname of the Terraform Cloud/Enterprise instance that the `terraform_token` secret authenticates to. Defaults to `app.terraform.io`."

      fmt_enabled:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether to check formatting with `terraform fmt`. Defaults to `true`."
      validate_enabled:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether to run `terraform init -backend=false` and `terraform validate`. Defaults to `true`."
      tflint_enabled:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether to lint with `tflint`. Defaults to `true`."
      tflint_config_file:
        type: string
        required: false
        default: .tflint.hcl
        description: "(Optional) The path to the `tflint` config file, relative to the repository root. Defaults to `.tflint.hcl`."
      tflint_minimum_failure_severity:
        type: string
        required: false
        default: warning
        description: "(Optional) The minimum `tflint` severity that fails the job. Valid values are `error`, `warning`, or `notice`. Defaults to `warning`."
      tflint_recursive:
        type: boolean
        required: false
        default: false
        description: "(Optional) Whether `tflint` also lints nested directories under each changed directory that contain Terraform files. Defaults to `false`."
      terraform_docs_enabled:
        type: boolean
        required: false
        default: false
        description: "(Optional) Whether to check that `README.md` is up to date with `terraform-docs`. Directories without a `README.md` are skipped. The check only passes when CI reproduces the local generation: pin `terraform-docs` in the repository's `mise.toml` to the version used with pre-commit, and either commit `.terraform.lock.hcl` or set `settings.lockfile: false` in `.terraform-docs.yml` so the provider version column does not depend on a local lock file. Defaults to `false`."
      terraform_docs_config_file:
        type: string
        required: false
        description: "(Optional) The path to the `terraform-docs` config file, relative to the repository root. When omitted, `terraform-docs` discovers `.terraform-docs.yml` from the module directory as usual."
      terraform_docs_args:
        type: string
        required: false
        default: --sort-by required
        description: "(Optional) Additional arguments to pass to `terraform-docs`. Defaults to `--sort-by required`."
      terraform_docs_recursive:
        type: boolean
        required: false
        default: false
        description: "(Optional) Whether `terraform-docs` also checks the submodules under `terraform_docs_recursive_path` of each changed directory. Defaults to `false`."
      terraform_docs_recursive_path:
        type: string
        required: false
        default: modules
        description: "(Optional) The directory, relative to each changed directory, whose subdirectories are checked as submodules when `terraform_docs_recursive` is enabled. Defaults to `modules`."
      terraform_docs_recursive_exclude:
        type: string
        required: false
        description: "(Optional) A comma-separated list of submodule directories to exclude when `terraform_docs_recursive` is enabled, relative to `terraform_docs_recursive_path`."

      pr_comment_enabled:
        type: boolean
        required: false
        default: true
        description: "(Optional) Whether to post the integration report as a single sticky comment on pull requests. Requires the `pull-requests: write` permission on the caller. The report is always written to the job summary. Defaults to `true`."

    secrets:
      terraform_token:
        required: false
        description: "(Optional) The API token for the Terraform Cloud/Enterprise instance at `terraform_host`. Exported as a `TF_TOKEN_<host>` environment variable so `terraform init` can download private registry modules."


jobs:
  changed:
    name: Detect Changed Directories
    runs-on: ${{ fromJson(inputs.runs_on) }}

    outputs:
      has_directories: ${{ steps.changed-dirs.outputs.has_directories }}
      directories: ${{ steps.changed-dirs.outputs.directories }}

    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get Changed Directories
      id: changed-dirs
      uses: tedilabs/github-actions/.github/actions/git.changed-dirs@main
      with:
        paths: ${{ inputs.paths }}
        max_depth: ${{ inputs.paths_max_depth }}


  lint:
    name: Lint (${{ matrix.path }})
    needs:
    - changed
    if: needs.changed.outputs.has_directories == 'true'
    runs-on: ${{ fromJson(inputs.runs_on) }}

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.changed.outputs.directories) }}

    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v7

    # The tools and their versions come from the repository's mise config (`mise.toml` or `.tool-versions`).
    # The module directory is passed so a `mise.toml` placed there overrides the repository-wide one,
    # and only the tools the enabled checks need are installed.
    - name: Set up tools
      id: setup-tools
      uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        working_directory: ${{ matrix.path }}
        install_args: >-
          terraform
          ${{ inputs.tflint_enabled && 'tflint' || '' }}
          ${{ inputs.terraform_docs_enabled && 'terraform-docs' || '' }}

    - name: Configure Terraform Credentials
      id: configure-credentials
      uses: tedilabs/github-actions/.github/actions/terraform.configure-credentials@main
      with:
        host: ${{ inputs.terraform_host }}
        token: ${{ secrets.terraform_token }}

    - name: Check Format
      id: fmt
      if: inputs.fmt_enabled
      continue-on-error: true
      uses: tedilabs/github-actions/.github/actions/terraform.fmt@main
      with:
        target_dir: ${{ matrix.path }}

    - name: Validate
      id: validate
      if: inputs.validate_enabled
      continue-on-error: true
      uses: tedilabs/github-actions/.github/actions/terraform.validate@main
      with:
        target_dir: ${{ matrix.path }}

    - name: Lint (tflint)
      id: tflint
      if: inputs.tflint_enabled
      continue-on-error: true
      uses: tedilabs/github-actions/.github/actions/terraform.tflint@main
      with:
        target_dir: ${{ matrix.path }}
        config_file: ${{ inputs.tflint_config_file }}
        minimum_failure_severity: ${{ inputs.tflint_minimum_failure_severity }}
        recursive: ${{ inputs.tflint_recursive }}

    - name: Check Docs
      id: docs
      if: inputs.terraform_docs_enabled
      continue-on-error: true
      uses: tedilabs/github-actions/.github/actions/terraform.docs@main
      with:
        target_dir: ${{ matrix.path }}
        check: "true"
        config_file: ${{ inputs.terraform_docs_config_file }}
        recursive: ${{ inputs.terraform_docs_recursive }}
        recursive_path: ${{ inputs.terraform_docs_recursive_path }}
        recursive_exclude: ${{ inputs.terraform_docs_recursive_exclude }}
        args: ${{ inputs.terraform_docs_args }}

    - name: Collect Results
      id: results
      if: always()
      uses: tedilabs/github-actions/.github/actions/github.matrix-report@main
      with:
        mode: collect
        id: ${{ matrix.path }}
        id_label: Directory
        artifact_prefix: terraform-integration
        job_status: ${{ job.status }}
        # An empty value keeps a check that is turned off out of the report; a check that ran but had
        # nothing to do reports `skipped`.
        results: |
          {
            "fmt": "${{ inputs.fmt_enabled && (steps.fmt.outputs.skipped == 'true' && 'skipped' || steps.fmt.outcome) || '' }}",
            "validate": "${{ inputs.validate_enabled && (steps.validate.outputs.skipped == 'true' && 'skipped' || steps.validate.outcome) || '' }}",
            "tflint": "${{ inputs.tflint_enabled && (steps.tflint.outputs.skipped == 'true' && 'skipped' || steps.tflint.outcome) || '' }}",
            "docs": "${{ inputs.terraform_docs_enabled && (steps.docs.outputs.skipped == 'true' && 'skipped' || steps.docs.outcome) || '' }}"
          }


  report:
    name: Report
    needs:
    - changed
    - lint
    if: always() && needs.changed.outputs.has_directories == 'true'
    runs-on: ${{ fromJson(inputs.runs_on) }}

    steps:
    - name: Publish Report
      id: report
      uses: tedilabs/github-actions/.github/actions/github.matrix-report@main
      with:
        mode: publish
        id_label: Directory
        artifact_prefix: terraform-integration
        title: Terraform Integration
        pr_comment_enabled: ${{ inputs.pr_comment_enabled }}
        pr_comment_marker: terraform-integration
