name: Test - CodeArtifact Configure Credentials


on:
  pull_request:
    paths:
    - .github/actions/aws.codeartifact.configure-credentials/**
    - .github/workflows/aws.codeartifact.configure-credentials.test.yaml
  push:
    branches:
    - main
    paths:
    - .github/actions/aws.codeartifact.configure-credentials/**
    - .github/workflows/aws.codeartifact.configure-credentials.test.yaml
  workflow_dispatch: {}


permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Tools
      uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        mise_toml: |
          [tools]
          uv = "0.13.2"

    - name: Test
      run: uv run .github/actions/aws.codeartifact.configure-credentials/tests/test_action.py

    - name: Mock AWS CLI
      shell: bash
      run: |
        mock_bin="$(mktemp -d "$RUNNER_TEMP/codeartifact-test.XXXXXX")"
        cp .github/actions/aws.codeartifact.configure-credentials/tests/mock-aws.py "$mock_bin/aws"
        chmod +x "$mock_bin/aws"
        echo "$mock_bin" >> "$GITHUB_PATH"
        echo "MOCK_AWS_CALLS=$mock_bin/calls.jsonl" >> "$GITHUB_ENV"

    - name: Smoke Test Composite Action
      id: smoke
      uses: ./.github/actions/aws.codeartifact.configure-credentials
      with:
        aws_region: ap-northeast-1
        domain: example
        domain_owner: "111122223333"
        repository: internal
        format: npm

    - name: Check Smoke Test Outputs
      shell: bash
      env:
        REPOSITORY_ENDPOINT: ${{ steps.smoke.outputs.repository_endpoint }}
      run: |
        test "$CODEARTIFACT_AUTH_TOKEN" = mock-codeartifact-token
        test "$CODEARTIFACT_REPOSITORY_ENDPOINT" = https://example-111122223333.d.codeartifact.ap-northeast-1.amazonaws.com/npm/internal/
        test "$REPOSITORY_ENDPOINT" = "$CODEARTIFACT_REPOSITORY_ENDPOINT"
