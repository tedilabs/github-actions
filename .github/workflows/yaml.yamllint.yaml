name: YAML - yamllint


on:
  workflow_call:
    inputs:
      runs_on:
        description: >
          JSON-encoded runs-on value.
          Examples:
          - '"ubuntu-latest"'
          - '["self-hosted","linux","x64"]'
        required: false
        type: string
        default: '"ubuntu-latest"'

      yamllint_version:
        type: string
        required: false
        default: latest
        description: "(Optional) The version of `yamllint` to install with mise. Defaults to `latest`."
      yamllint_config_file:
        type: string
        required: false
        default: ".yamllint.yaml"
        description: "(Optional) The path to the `yamllint` config file. Defaults to `.yamllint.yaml`."
      yamllint_target_dir:
        type: string
        required: false
        default: ./
        description: "(Optional) A directory path to scan. Defaults to `./`."

    secrets:
      token:
        required: false
        description: "(Optional) The GitHub API token to use when communicating with GitHub API."


jobs:
  yamllint:
    name: Lint YAML files
    runs-on: ${{ fromJson(inputs.runs_on) }}

    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v7

    - name: Setup tools with mise
      id: setup-tools
      uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        mise_toml: |
          [tools]
          "pipx:yamllint" = "${{ inputs.yamllint_version }}"

    - name: Lint YAML Files
      id: yaml-lint
      uses: tedilabs/github-actions/.github/actions/yaml.yamllint@feat/yaml-integration
      with:
        config_file: ${{ inputs.yamllint_config_file }}
        target_dir: ${{ inputs.yamllint_target_dir }}
