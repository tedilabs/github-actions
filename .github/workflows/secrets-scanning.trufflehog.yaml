name: Secrets Scanning - TruffleHog


on:
  workflow_call:
    inputs:
      runs_on:
        description: >
          JSON-encoded runs-on value.
          Examples:
          - '"ubuntu-latest"'
          - '["self-hosted","linux","x64"]'
        required: false
        type: string
        default: '"ubuntu-latest"'

      trufflehog_version:
        type: string
        required: false
        default: 3.97.0
        description: "(Optional) The TruffleHog version to install with mise (aqua backend), e.g. `3.95.6` or `latest`. Note: no `v` prefix."
      trufflehog_extra_args:
        type: string
        required: false
        default: --results=verified,unknown,unverified
        description: "(Optional) Extra CLI arguments forwarded to TruffleHog. Defaults to `--results=verified,unknown,unverified` so that committed-but-inactive credentials (rotated, expired, or test keys) are reported too, not only live ones. Narrow to `--results=verified` to report only confirmed-live secrets. Do not pass `--exclude-detectors` here: use `trufflehog_exclude_detectors` instead, since TruffleHog rejects the flag when it is repeated."
      trufflehog_exclude_detectors:
        type: string
        required: false
        default: lob
        description: "(Optional) Comma-separated detectors to skip, e.g. `lob` or `lob,slack`. Rendered as `--exclude-detectors`, and omitted entirely when empty so that every detector runs. Detectors are named by their protobuf name or ID; an unrecognized name fails the scan."
      git_ref:
        type: string
        required: false
        default: ""
        description: "(Optional) The target ref (branch, tag, or SHA) to scan. Only honored on `workflow_dispatch`, where the whole history of this ref is scanned. When empty, defaults to the ref the workflow runs on. Ignored on `push` and `pull_request`, where the scope is derived from the event payload."
      path:
        type: string
        required: false
        default: ./
        description: "(Optional) The path of the git repository that TruffleHog scans. Defaults to `./`, the repository root."


jobs:
  scanning:
    name: Scan Leaked Secrets
    if: >
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ${{ fromJson(inputs.runs_on) }}

    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.git_ref }}
        # Full history is required to diff against the base commit (`push`, `pull_request`) and to walk the entire ref (`workflow_dispatch`).
        fetch-depth: 0

    - name: Setup tools with mise
      id: setup-tools
      uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        tool_versions: |
          trufflehog ${{ inputs.trufflehog_version }}

    - name: Resolve scan scope
      id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DISPATCH_BRANCH: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref_name }}
      run: |
        set -euo pipefail

        since_commit=""
        branch=""

        case "${EVENT_NAME}" in
          push)
            # Diff the pushed range. On the first push to a new branch `before`
            # is all-zeroes, so drop it to scan everything the push introduced.
            if [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              since_commit="${PUSH_BEFORE}"
            fi
            branch="${PUSH_AFTER}"
            ;;
          pull_request)
            # Diff the base branch against the PR head.
            since_commit="${PR_BASE_SHA}"
            branch="${PR_HEAD_SHA}"
            ;;
          *)
            # workflow_dispatch (and any fallback): full history of the target ref.
            branch="${DISPATCH_BRANCH}"
            ;;
        esac

        {
          echo "since_commit=${since_commit}"
          echo "branch=${branch}"
        } >> "${GITHUB_OUTPUT}"

        echo "Scan scope for '${EVENT_NAME}': since_commit='${since_commit}' branch='${branch}'"

    # Primary scan: fails the job (`--fail`) and emits inline PR annotations
    # (`--github-actions`) when secrets are found. No JSON here.
    - name: Scan for leaked secrets
      id: scan
      continue-on-error: true
      env:
        SCAN_PATH: ${{ inputs.path }}
        SINCE_COMMIT: ${{ steps.scope.outputs.since_commit }}
        BRANCH: ${{ steps.scope.outputs.branch }}
        EXTRA_ARGS: ${{ inputs.trufflehog_extra_args }}
        EXCLUDE_DETECTORS: ${{ inputs.trufflehog_exclude_detectors }}
      run: |
        set -euo pipefail

        repo_dir="$(cd "${SCAN_PATH}" && pwd)"

        scan_args=(git "file://${repo_dir}")
        # Preserve whitespace-separated CLI arguments without unquoted expansion,
        # which could also expand glob characters in the workspace.
        read -r -a extra_args <<< "${EXTRA_ARGS}"
        [ -n "${SINCE_COMMIT}" ] && scan_args+=(--since-commit "${SINCE_COMMIT}")
        [ -n "${BRANCH}" ] && scan_args+=(--branch "${BRANCH}")
        # TruffleHog rejects `--exclude-detectors` when repeated, so it is passed at
        # most once and omitted entirely when the input is empty.
        [ -n "${EXCLUDE_DETECTORS}" ] && scan_args+=(--exclude-detectors "${EXCLUDE_DETECTORS}")

        echo "Running: trufflehog ${scan_args[*]} --fail --no-update --github-actions ${EXTRA_ARGS}"
        trufflehog "${scan_args[@]}" --fail --no-update --github-actions "${extra_args[@]}"

    # A non-zero exit can mean either detected secrets or a scanner error.
    # Re-run with JSON to distinguish the two and build the appropriate report.
    - name: Re-scan and classify result
      id: report
      if: ${{ steps.scan.outcome == 'failure' }}
      env:
        SCAN_PATH: ${{ inputs.path }}
        SINCE_COMMIT: ${{ steps.scope.outputs.since_commit }}
        BRANCH: ${{ steps.scope.outputs.branch }}
        EXTRA_ARGS: ${{ inputs.trufflehog_extra_args }}
        EXCLUDE_DETECTORS: ${{ inputs.trufflehog_exclude_detectors }}
      run: |
        set -euo pipefail

        repo_dir="$(cd "${SCAN_PATH}" && pwd)"

        scan_args=(git "file://${repo_dir}")
        # Preserve whitespace-separated CLI arguments without unquoted expansion,
        # which could also expand glob characters in the workspace.
        read -r -a extra_args <<< "${EXTRA_ARGS}"
        [ -n "${SINCE_COMMIT}" ] && scan_args+=(--since-commit "${SINCE_COMMIT}")
        [ -n "${BRANCH}" ] && scan_args+=(--branch "${BRANCH}")
        # Must match the primary scan, or the report would list findings the scan
        # itself skipped.
        [ -n "${EXCLUDE_DETECTORS}" ] && scan_args+=(--exclude-detectors "${EXCLUDE_DETECTORS}")

        # JSON findings on stdout; no `--fail`/`--github-actions` so stdout stays
        # clean JSONL (annotations were already emitted by the primary scan).
        set +e
        trufflehog "${scan_args[@]}" --json --no-update "${extra_args[@]}" > results.json 2> trufflehog.log
        scan_exit_code="$?"
        set -e

        count="$(grep -c '"SourceMetadata"' results.json || true)"
        count="${count:-0}"

        if [ "${count}" -gt 0 ]; then
          echo "outcome=secrets" >> "${GITHUB_OUTPUT}"
          {
            echo "## 🔑 TruffleHog Secret Scan"
            echo ""
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Scope:** \`${SINCE_COMMIT:-<full history>}\` -> \`${BRANCH:-HEAD}\`"
            echo ""
            echo "❌ **${count} potential secret(s) detected.** Revoke/rotate any real credential immediately and remove it from history."
            echo ""
            echo "| Detector | Status | File | Line | Commit |"
            echo "| --- | --- | --- | --: | --- |"
            # Only non-sensitive metadata is rendered; the raw secret value is
            # never written to the summary or the PR comment.
            jq -r '
              "| " + .DetectorName
              + " | " + (if .Verified then "✅ verified" else "⚠️ unverified" end)
              + " | " + (.SourceMetadata.Data.Git.file // "-")
              + " | " + ((.SourceMetadata.Data.Git.line // 0) | tostring)
              + " | " + ((.SourceMetadata.Data.Git.commit // "-")[0:10])
              + " |"
            ' results.json
          } > report.md
        else
          echo "outcome=scanner_error" >> "${GITHUB_OUTPUT}"
          {
            echo "## ⚠️ Secret Scanning Error"
            echo ""
            echo "An unknown error occurred while running Secret Scanning. Please contact the Infrastructure Team."
            echo ""
            echo "This is a scanner error, not a confirmed secret leak, so you may merge this pull request first."
            echo ""
            echo "- **Scanner exit code:** \`${scan_exit_code}\`"
          } > report.md
        fi

        cat report.md >> "${GITHUB_STEP_SUMMARY}"

        {
          echo "report<<REPORT_EOF"
          cat report.md
          echo "REPORT_EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Comment scan result on the pull request
      id: github-pr-comment
      if: ${{ steps.report.conclusion == 'success' && github.event_name == 'pull_request' }}
      uses: tedilabs/github-actions/.github/actions/github.pr.sticky-comment@main
      with:
        marker: trufflehog-secret-scan
        body: ${{ steps.report.outputs.report }}

    - name: Fail when secrets are detected
      if: ${{ steps.report.outputs.outcome == 'secrets' }}
      run: exit 1

    - name: Report no secrets detected
      if: ${{ steps.scan.outcome == 'success' }}
      env:
        SINCE_COMMIT: ${{ steps.scope.outputs.since_commit }}
        BRANCH: ${{ steps.scope.outputs.branch }}
      run: |-
        set -euo pipefail

        {
          echo "## 🔑 TruffleHog Secret Scan"
          echo ""
          echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
          echo "- **Scope:** \`${SINCE_COMMIT:-<full history>}\` -> \`${BRANCH:-HEAD}\`"
          echo ""
          echo "✅ **No secrets detected.**"
        } >> "${GITHUB_STEP_SUMMARY}"
