name: GitHub Actions - check-jsonschema
description: Validate GitHub Actions workflow files and action metadata files (`action.yml`, `action.yaml`) against the SchemaStore schemas with `check-jsonschema`. Unlike `actionlint`, this also covers composite actions. On failure, the findings are added to the job summary. Requires the `check-jsonschema` CLI on the `PATH`.


inputs:
  target_dir:
    required: false
    default: ./
    description: "(Optional) The repository root to validate. Defaults to `./`."
  validate_workflows:
    required: false
    default: "true"
    description: "(Optional) Whether to validate the workflow files in `.github/workflows`. Defaults to `true`."
  validate_actions:
    required: false
    default: "true"
    description: "(Optional) Whether to validate every `action.yml` and `action.yaml` found under `target_dir`, excluding `.git` and `node_modules`. Defaults to `true`."

outputs:
  # When the workflow validation fails, the action validation does not run, so the outputs come from the command that failed.
  stdout:
    value: ${{ steps.validate-workflows.outcome == 'failure' && steps.validate-workflows.outputs.stdout || steps.validate-actions.outputs.stdout }}
    description: "The STDOUT stream of the `check-jsonschema` call on the action files, or on the workflow files when that call failed. Empty when nothing was validated."
  stderr:
    value: ${{ steps.validate-workflows.outcome == 'failure' && steps.validate-workflows.outputs.stderr || steps.validate-actions.outputs.stderr }}
    description: "The STDERR stream of the `check-jsonschema` call on the action files, or on the workflow files when that call failed. Empty when nothing was validated."
  exitcode:
    value: ${{ steps.validate-workflows.outcome == 'failure' && steps.validate-workflows.outputs.exitcode || steps.validate-actions.outputs.exitcode }}
    description: "The exit code of the `check-jsonschema` call on the action files, or on the workflow files when that call failed. Empty when nothing was validated. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Targets
    id: target
    shell: bash
    env:
      TARGET_DIR: ${{ inputs.target_dir }}
      VALIDATE_WORKFLOWS: ${{ inputs.validate_workflows }}
      VALIDATE_ACTIONS: ${{ inputs.validate_actions }}
    run: |
      cd "$TARGET_DIR" || exit 1
      check-jsonschema --version

      # A file list stays empty when its validation is disabled or finds nothing, which skips the matching step.
      delimiter="$(head -c 15 /dev/urandom | base64)"
      if [ "$VALIDATE_WORKFLOWS" = "true" ]; then
        files=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | sort)
        if [ -z "$files" ]; then
          echo "No workflow files found. Skipping."
        fi
        printf 'workflow_files<<%s\n%s\n%s\n' "$delimiter" "$files" "$delimiter" >> "$GITHUB_OUTPUT"
      fi
      if [ "$VALIDATE_ACTIONS" = "true" ]; then
        files=$(
          find . -path ./.git -prune -o -path '*/node_modules' -prune -o \
            -type f \( -name action.yml -o -name action.yaml \) -print | sort
        )
        if [ -z "$files" ]; then
          echo "No action metadata files found. Skipping."
        fi
        printf 'action_files<<%s\n%s\n%s\n' "$delimiter" "$files" "$delimiter" >> "$GITHUB_OUTPUT"
      fi

  - name: Validate Workflows
    id: validate-workflows
    if: steps.target.outputs.workflow_files != ''
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      FILES: ${{ steps.target.outputs.workflow_files }}
    with:
      working_directory: ${{ inputs.target_dir }}
      run: |
        printf '%s\n' "$FILES" | tr '\n' '\0' \
          | xargs -0 check-jsonschema --builtin-schema vendor.github-workflows

  - name: Add Failure Details to Job Summary
    id: validate-workflows-summary
    if: steps.validate-workflows.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ check-jsonschema (workflows) · ${{ inputs.target_dir }}"
      file: ${{ steps.validate-workflows.outputs.log_file }}
      lang: text

  - name: Validate Actions
    id: validate-actions
    if: steps.target.outputs.action_files != ''
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      FILES: ${{ steps.target.outputs.action_files }}
    with:
      working_directory: ${{ inputs.target_dir }}
      run: |
        printf '%s\n' "$FILES" | tr '\n' '\0' \
          | xargs -0 check-jsonschema --builtin-schema vendor.github-actions

  - name: Add Failure Details to Job Summary
    id: validate-actions-summary
    if: steps.validate-actions.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ check-jsonschema (actions) · ${{ inputs.target_dir }}"
      file: ${{ steps.validate-actions.outputs.log_file }}
      lang: text
