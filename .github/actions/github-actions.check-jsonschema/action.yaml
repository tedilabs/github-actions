name: GitHub Actions - check-jsonschema
description: Validate GitHub Actions workflow files or action metadata files (`action.yml`, `action.yaml`) against the SchemaStore schemas with `check-jsonschema`. Unlike `actionlint`, this also covers composite actions. On failure, the findings are added to the job summary. Requires the `check-jsonschema` CLI on the `PATH`.


inputs:
  schema_type:
    required: true
    description: "(Required) The kind of files to validate. `workflows` validates the `*.yml` and `*.yaml` files directly in `target_dir` against the workflow schema. `actions` validates every `action.yml` and `action.yaml` under `target_dir`, excluding `.git` and `node_modules`, against the action metadata schema."
  target_dir:
    required: false
    description: "(Optional) The directory to validate. Defaults to `.github/workflows` for `schema_type: workflows` and to `.github/actions` for `schema_type: actions`."
  annotations_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to annotate the failing files in the pull request when the validation fails, by re-running `check-jsonschema` with `--output-format json`. Schema validation reports no line numbers, so the annotation points at the file and names the failing JSON path. Defaults to `true`."

outputs:
  skipped:
    value: ${{ steps.target.outputs.skipped }}
    description: "`true` when `target_dir` holds no matching files and `check-jsonschema` was not run. Empty otherwise."
  stdout:
    value: ${{ steps.validate.outputs.stdout }}
    description: "The STDOUT stream of the call to `check-jsonschema`. Empty when skipped."
  stderr:
    value: ${{ steps.validate.outputs.stderr }}
    description: "The STDERR stream of the call to `check-jsonschema`. Empty when skipped."
  exitcode:
    value: ${{ steps.validate.outputs.exitcode }}
    description: "The exit code of the call to `check-jsonschema`. Empty when skipped. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Targets
    id: target
    shell: bash
    env:
      SCHEMA_TYPE: ${{ inputs.schema_type }}
      TARGET_DIR: ${{ inputs.target_dir }}
    run: |
      case "$SCHEMA_TYPE" in
        workflows)
          target_dir="${TARGET_DIR:-.github/workflows}"
          schema="vendor.github-workflows"
          ;;
        actions)
          target_dir="${TARGET_DIR:-.github/actions}"
          schema="vendor.github-actions"
          ;;
        *)
          echo "::error::Invalid schema_type: '$SCHEMA_TYPE'. Expected 'workflows' or 'actions'."
          exit 1
          ;;
      esac
      target_dir="${target_dir%/}"
      target_dir="${target_dir:-.}"
      echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"
      echo "schema=$schema" >> "$GITHUB_OUTPUT"

      # GitHub only reads workflow files directly in the workflows directory, while actions live in subdirectories.
      # A directory that does not exist holds nothing to validate and is skipped like an empty one; `find` would fail on it.
      files=""
      if [ ! -d "$target_dir" ]; then
        :
      elif [ "$SCHEMA_TYPE" = "workflows" ]; then
        files=$(find "$target_dir" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
      else
        files=$(
          find "$target_dir" -path '*/.git' -prune -o -path '*/node_modules' -prune -o \
            -type f \( -name action.yml -o -name action.yaml \) -print | sort
        )
      fi

      # `check-jsonschema` needs at least one file, and an empty target would otherwise report a vacuous pass.
      if [ -z "$files" ]; then
        echo "::notice::Skipping check-jsonschema ($SCHEMA_TYPE): no matching files in $target_dir."
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        exit 0
      fi

      delimiter="$(head -c 15 /dev/urandom | base64)"
      printf 'files<<%s\n%s\n%s\n' "$delimiter" "$files" "$delimiter" >> "$GITHUB_OUTPUT"

      check-jsonschema --version

  - name: Validate
    id: validate
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      SCHEMA: ${{ steps.target.outputs.schema }}
      FILES: ${{ steps.target.outputs.files }}
    with:
      run: |
        # Pass the files as arguments rather than through `xargs`, which would report any failure as exit code 123.
        readarray -t files <<< "$FILES"
        check-jsonschema --builtin-schema "$SCHEMA" "${files[@]}"

  # GitHub only renders annotations from `::error` lines, so the errors are re-read as JSON. The file names are
  # the ones passed in, which are repository-relative already.
  - name: Annotate Findings
    id: validate-annotate
    if: always() && inputs.annotations_enabled == 'true' && steps.validate.outcome == 'failure'
    shell: bash
    env:
      SCHEMA_TYPE: ${{ inputs.schema_type }}
      SCHEMA: ${{ steps.target.outputs.schema }}
      FILES: ${{ steps.target.outputs.files }}
    run: |
      # A workflow command takes one line, so newlines and the property separators are percent-encoded the way
      # the runner decodes them.
      readarray -t files <<< "$FILES"
      check-jsonschema --builtin-schema "$SCHEMA" --output-format json "${files[@]}" 2>/dev/null | jq -r --arg type "$SCHEMA_TYPE" '
        def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
        def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
        (.errors // [])[]
        | "::error file=\(.filename),title=\("check-jsonschema · " + $type | prop)::\(.path + ": " + .message | esc)"
      ' || true

  - name: Add Failure Details to Job Summary
    id: validate-summary
    if: always() && steps.validate.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ check-jsonschema (${{ inputs.schema_type }}) · ${{ steps.target.outputs.target_dir }}"
      file: ${{ steps.validate.outputs.log_file }}
      lang: text
