name: Web - Set Version (CloudFront Key-Value Store)
description: Set Version in CloudFront Key-Value Store for the web application.


inputs:
  aws_region:
    required: false
    description: "(Optional) The region of the AWS."
  aws_access_key_id:
    required: false
    description: "(Optional) The access key ID used to authenticate to the AWS."
  aws_secret_access_key:
    required: false
    description: "(Optional) The secret access key used to authenticate to the AWS."
  aws_github_oidc_iam_role:
    required: false
    description: "(Optional) The ARN (Amazon Resource Name) of the IAM role to assume via GitHub OIDC to authenticate."
  aws_github_oidc_session_name:
    required: false
    default: GitHubActions
    description: "(Optional) The identifier for the assumed role session via GitHub OIDC. Defaults to `GitHubActions`."
  aws_github_oidc_audience:
    required: false
    default: sts.amazonaws.com
    description: "(Optional) The OIDC audience to be specified when the JWT is created. Defaults to `sts.amazonaws.com`. This will work for most cases. Changing the default audience may be necessary when using non-default AWS partitions, such as China regions."
  aws_chained_iam_role:
    required: false
    description: "(Optional) The ARN of the chained IAM role to assume after assuming the GitHub OIDC IAM role or after configuring AWS credentials with access key and secret access key."
  aws_chained_session_name:
    required: false
    default: GitHubActions
    description: "(Optional) The identifier for the assumed role session when assuming the chained IAM role. Defaults to `GitHubActions`."

  version:
    required: true
    description: |
      (Required) The version string to set in CloudFront Key-Value Store. This can be used to indicate the version of the web application to serve.
      Supported placeholders:
      - <pr-number>: Pull request number
      - <source-branch>: Source branch name (e.g., `feature-branch`)
      - <target-branch>: Target branch name (e.g., `main`)
      - <ref-name>: Reference name (e.g., `pr-123`, `main`, `v1.0.0`)
      - <sha>: Full commit SHA
      - <short-sha>: Short commit SHA (7 chars)
      - <repo-name>: Repository name
      - <owner>: Repository owner
  version_key:
    required: false
    default: "version"
    description: "(Optional) The key in CloudFront Key-Value Store to set the version value to. Defaults to `version`."
  previous_version_key:
    required: false
    default: "previous_version"
    description: "(Optional) The key in CloudFront Key-Value Store to set the previous version value to during rotation. Defaults to `previous_version`. This is used together with `version_key` to perform atomic update of the current and previous version in CloudFront Key-Value Store, which can be helpful for rollback purposes."
  aws_cloudfront_kvs_arn:
    required: true
    description: "(Required) The ARN of the CloudFront Key-Value Store where the version information will be stored. The action will perform atomic update of the current version and previous version (if `previous_version_key` is specified) in the CloudFront Key-Value Store, which can be helpful for rollback purposes."

outputs:
  version:
    value: ${{ steps.set-version.outputs.new_version }}
    description: "The new version that has been set in CloudFront Key-Value Store"
  previous_version:
    value: ${{ steps.set-version.outputs.previous_version }}
    description: "Previous version before this deployment"

runs:
  using: composite

  steps:
  - name: Render Templates
    id: render-templates
    uses: tedilabs/github-actions/.github/actions/misc.string-interpolation@main
    with:
      inputs: |
        {
          "version": "${{ inputs.version }}"
        }

  - name: Configure AWS Credentials
    id: configure-aws-credentials
    uses: tedilabs/github-actions/.github/actions/aws.configure-credentials@main
    with:
      aws_region: ${{ inputs.aws_region }}
      aws_access_key_id: ${{ inputs.aws_access_key_id }}
      aws_secret_access_key: ${{ inputs.aws_secret_access_key }}
      aws_github_oidc_iam_role: ${{ inputs.aws_github_oidc_iam_role }}
      aws_github_oidc_session_name: ${{ inputs.aws_github_oidc_session_name }}
      aws_github_oidc_audience: ${{ inputs.aws_github_oidc_audience }}
      aws_chained_iam_role: ${{ inputs.aws_chained_iam_role }}
      aws_chained_session_name: ${{ inputs.aws_chained_session_name }}

  - name: Set Version
    id: set-version
    shell: bash
    env:
      AWS_CLOUDFRONT_KVS_ARN: ${{ inputs.aws_cloudfront_kvs_arn }}
      VERSION_KEY: ${{ inputs.version_key }}
      PREVIOUS_VERSION_KEY: ${{ inputs.previous_version_key }}
      NEW_VERSION: ${{ fromJSON(steps.render-templates.outputs.interpolated).version }}
    run: |
      # Get current ETag
      ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store \
        --kvs-arn "${AWS_CLOUDFRONT_KVS_ARN}" \
        --query "ETag" --output text)

      # Read current version (may not exist yet)
      CURRENT_VERSION=$(aws cloudfront-keyvaluestore get-key \
        --kvs-arn "${AWS_CLOUDFRONT_KVS_ARN}" \
        --key "${VERSION_KEY}" \
        --query "Value" --output text 2>/dev/null || echo "")

      echo "previous_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
      echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # Check if new version is the same as current
      if [ "${CURRENT_VERSION}" = "${NEW_VERSION}" ]; then
        echo "::error::Version ${NEW_VERSION} is already deployed for key ${VERSION_KEY}. Skipping update."
        exit 1
      fi

      # Atomic update
      if [ -n "${CURRENT_VERSION}" ]; then
        echo "Rotating: ${VERSION_KEY}=${CURRENT_VERSION} -> ${NEW_VERSION}"
        aws cloudfront-keyvaluestore update-keys \
          --kvs-arn "${AWS_CLOUDFRONT_KVS_ARN}" \
          --if-match "${ETAG}" \
          --puts \
            "Key=${VERSION_KEY},Value=${NEW_VERSION}" \
            "Key=${PREVIOUS_VERSION_KEY},Value=${CURRENT_VERSION}"
      else
        echo "Initial deployment: ${VERSION_KEY}=${NEW_VERSION}"
        aws cloudfront-keyvaluestore update-keys \
          --kvs-arn "${AWS_CLOUDFRONT_KVS_ARN}" \
          --if-match "${ETAG}" \
          --puts \
            "Key=${VERSION_KEY},Value=${NEW_VERSION}"
      fi

      echo "Done. version=${NEW_VERSION}, previous=${CURRENT_VERSION:-none}"
