name: Terraform - TFLint
description: Lint a Terraform directory with `tflint`. On failure, the findings are added to the job summary. Requires the `tflint` CLI on the `PATH`.


inputs:
  target_dir:
    required: false
    default: ./
    description: "(Optional) The directory to lint. Defaults to `./`."
  mode:
    required: false
    default: module
    description: "(Optional) What kind of Terraform directory is being linted. `module` lints the configuration as written. `workspace` lints it as a named Terraform workspace, which is needed when the configuration references `terraform.workspace` (e.g. to locate `<workspace>/config.yaml`) — `tflint` evaluates that expression as `default` unless it is told otherwise. Valid values are `module` or `workspace`. Defaults to `module`."
  workspace:
    required: false
    default: default
    description: "(Optional) The Terraform workspace name to lint as, exported as `TF_WORKSPACE`. Only used when `mode` is `workspace`, and an empty value falls back to the default. Defaults to Terraform's `default` workspace."
  config_file:
    required: false
    default: .tflint.hcl
    description: "(Optional) The path to the `tflint` config file, relative to the repository root. When the file does not exist, the action warns and lints with the `tflint` defaults. Defaults to `.tflint.hcl`."
  recursive:
    required: false
    default: "false"
    description: "(Optional) Whether to lint every directory under `target_dir` that contains Terraform files, using the same config file for all of them. Defaults to `false`."
  minimum_failure_severity:
    required: false
    default: warning
    description: "(Optional) The minimum severity that fails the step. Valid values are `error`, `warning`, or `notice`. Defaults to `warning`."
  format:
    required: false
    default: compact
    description: "(Optional) The output format of `tflint`. Defaults to `compact`."
  cache:
    required: false
    default: "true"
    description: "(Optional) Whether to cache the installed `tflint` plugins (`~/.tflint.d/plugins`), keyed by the content of the config file. Defaults to `true`."
  github_token:
    required: false
    default: ${{ github.token }}
    description: "(Optional) The GitHub token used by `tflint --init` to download plugins from GitHub without hitting the anonymous rate limit. Defaults to the automatically generated `github.token`."
  annotations_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to annotate the reported lines in the pull request when `tflint` fails, by re-running it with `--format json` and turning each issue into a workflow error, warning, or notice. Defaults to `true`."

outputs:
  skipped:
    value: ${{ steps.target.outputs.skipped }}
    description: "`true` when `target_dir` holds no Terraform files and `tflint` was not run. Empty otherwise."
  # When `tflint --init` fails, `tflint` does not run, so the outputs come from the command that failed.
  stdout:
    value: ${{ steps.init.outcome == 'failure' && steps.init.outputs.stdout || steps.tflint.outputs.stdout }}
    description: "The STDOUT stream of the call to `tflint`, or to `tflint --init` when it failed. Empty when skipped."
  stderr:
    value: ${{ steps.init.outcome == 'failure' && steps.init.outputs.stderr || steps.tflint.outputs.stderr }}
    description: "The STDERR stream of the call to `tflint`, or to `tflint --init` when it failed. Empty when skipped."
  exitcode:
    value: ${{ steps.init.outcome == 'failure' && steps.init.outputs.exitcode || steps.tflint.outputs.exitcode }}
    description: "The exit code of the call to `tflint`, or to `tflint --init` when it failed. Empty when skipped. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Options
    id: target
    shell: bash
    env:
      TARGET_DIR: ${{ inputs.target_dir }}
      MODE: ${{ inputs.mode }}
      WORKSPACE: ${{ inputs.workspace }}
      CONFIG_FILE: ${{ inputs.config_file }}
      RECURSIVE: ${{ inputs.recursive }}
    run: |
      # `tflint` reads the configuration and its input variables, but never the state or the backend. The one
      # thing it cannot infer is the workspace: `terraform.workspace` evaluates to `default` unless
      # `TF_WORKSPACE` is set. Resolving it here keeps every `tflint` call below on the same workspace.
      case "$MODE" in
        module)
          workspace=""
          ;;
        workspace)
          # The caller may pass an empty workspace (e.g. a matrix entry for a single-workspace project),
          # which the action input default does not cover.
          workspace="${WORKSPACE:-default}"
          ;;
        *)
          echo "::error::Invalid mode: $MODE. Valid values are module or workspace."
          exit 1
          ;;
      esac
      echo "workspace=$workspace" >> "$GITHUB_OUTPUT"

      # A trailing slash (e.g. `./`) makes `--recursive` silently skip every subdirectory, so strip it.
      target_dir="${TARGET_DIR%/}"
      target_dir="${target_dir:-.}"
      echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"

      # `tflint` exits 0 on a directory without Terraform files, which would report a vacuous pass.
      depth_args=()
      [ "$RECURSIVE" = "true" ] || depth_args=(-maxdepth 1)
      if [ -z "$(find "$target_dir" "${depth_args[@]}" -type f \( -name '*.tf' -o -name '*.tf.json' \) -print -quit)" ]; then
        echo "::notice::Skipping tflint: no Terraform files in $target_dir."
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        exit 0
      fi

      # `tflint` resolves a relative `--config` against `--chdir`, so make it absolute. A missing config
      # file is not fatal: `tflint` lints with its own defaults when `--config` is left out.
      if [ -n "$CONFIG_FILE" ] && [ -f "$CONFIG_FILE" ]; then
        echo "config=$(realpath "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
      elif [ -n "$CONFIG_FILE" ]; then
        echo "::warning::tflint config file not found: $CONFIG_FILE. Linting with the tflint defaults."
      fi

      tflint --version

  - name: Cache TFLint Plugins
    id: cache
    if: inputs.cache == 'true' && steps.target.outputs.skipped != 'true'
    uses: actions/cache@v6
    with:
      path: ~/.tflint.d/plugins
      key: tflint-plugins-${{ runner.os }}-${{ hashFiles(inputs.config_file) }}

  - name: Init TFLint
    id: init
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      GITHUB_TOKEN: ${{ inputs.github_token }}
      TARGET_DIR: ${{ steps.target.outputs.target_dir }}
      CONFIG: ${{ steps.target.outputs.config }}
      RECURSIVE: ${{ inputs.recursive }}
    with:
      run: |
        args=(--chdir "$TARGET_DIR")
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
        fi
        if [ "$RECURSIVE" = "true" ]; then
          args+=(--recursive)
        fi

        tflint "${args[@]}" --init

  - name: Add Failure Details to Job Summary
    id: init-summary
    if: always() && steps.init.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ tflint --init · ${{ inputs.target_dir }}"
      file: ${{ steps.init.outputs.log_file }}
      lang: text

  - name: Run TFLint
    id: tflint
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      TARGET_DIR: ${{ steps.target.outputs.target_dir }}
      WORKSPACE: ${{ steps.target.outputs.workspace }}
      CONFIG: ${{ steps.target.outputs.config }}
      RECURSIVE: ${{ inputs.recursive }}
      MINIMUM_FAILURE_SEVERITY: ${{ inputs.minimum_failure_severity }}
      FORMAT: ${{ inputs.format }}
    with:
      run: |
        if [ -n "$WORKSPACE" ]; then
          export TF_WORKSPACE="$WORKSPACE"
        fi

        args=(--chdir "$TARGET_DIR")
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
        fi
        if [ "$RECURSIVE" = "true" ]; then
          args+=(--recursive)
        fi

        tflint "${args[@]}" \
          --format "$FORMAT" \
          --minimum-failure-severity "$MINIMUM_FAILURE_SEVERITY"

  # GitHub only renders annotations from `::error` lines, so the issues are re-read as JSON. The paths in that
  # output are relative to the working directory, so they already point into the repository.
  - name: Annotate Findings
    id: tflint-annotate
    if: always() && inputs.annotations_enabled == 'true' && steps.tflint.outcome == 'failure'
    shell: bash
    env:
      TARGET_DIR: ${{ steps.target.outputs.target_dir }}
      WORKSPACE: ${{ steps.target.outputs.workspace }}
      CONFIG: ${{ steps.target.outputs.config }}
      RECURSIVE: ${{ inputs.recursive }}
    run: |
      if [ -n "$WORKSPACE" ]; then
        export TF_WORKSPACE="$WORKSPACE"
      fi

      args=(--chdir "$TARGET_DIR")
      if [ -n "$CONFIG" ]; then
        args+=(--config "$CONFIG")
      fi
      if [ "$RECURSIVE" = "true" ]; then
        args+=(--recursive)
      fi

      # A workflow command takes one line, so newlines and the property separators are percent-encoded the way
      # the runner decodes them.
      tflint "${args[@]}" --format json 2>/dev/null | jq -r '
        def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
        def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
        (.issues[] | {severity: .rule.severity, title: ("tflint · " + .rule.name), message, range}),
        (.errors[] | {severity: (.severity // "error"), title: "tflint", message, range})
        | (if .severity == "error" then "error" elif .severity == "warning" then "warning" else "notice" end) as $severity
        | if .range then
            "::\($severity) file=\(.range.filename),line=\(.range.start.line),col=\(.range.start.column),endLine=\(.range.end.line),endColumn=\(.range.end.column),title=\(.title | prop)::\(.message | esc)"
          else
            "::\($severity) title=\(.title | prop)::\(.message | esc)"
          end
      ' || true

  - name: Add Failure Details to Job Summary
    id: tflint-summary
    if: always() && steps.tflint.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ tflint · ${{ inputs.target_dir }}"
      file: ${{ steps.tflint.outputs.log_file }}
      lang: text
