name: Terraform - Validate
description: Initialize a Terraform directory without a backend and validate it with `terraform validate`. On failure, the output is added to the job summary. Requires the `terraform` CLI on the `PATH`.


inputs:
  target_dir:
    required: false
    default: ./
    description: "(Optional) The directory to initialize and validate. Defaults to `./`."
  workspace:
    required: false
    description: "(Optional) The Terraform workspace name to validate as, exported as `TF_WORKSPACE`. Needed when the configuration references `terraform.workspace` (e.g. to locate `<workspace>/config.yaml`). Defaults to Terraform's `default` workspace."
  validate_tests:
    required: false
    default: "true"
    description: "(Optional) Whether to also validate the test files (`*.tftest.hcl`) under `test_directory`. Set to `false` to pass `-no-tests`. Defaults to `true`."
  test_directory:
    required: false
    default: tests
    description: "(Optional) The directory holding the test files, relative to `target_dir`, passed as `-test-directory`. Only used when `validate_tests` is `true`. Defaults to `tests`."
  validate_query:
    required: false
    default: "false"
    description: "(Optional) Whether to also validate the query files (`*.tfquery.hcl`) by passing `-query`, which needs Terraform 1.14 or later. Defaults to `false`."

outputs:
  skipped:
    value: ${{ steps.target.outputs.skipped }}
    description: "`true` when `target_dir` holds no Terraform files and neither `terraform init` nor `terraform validate` was run. Empty otherwise."
  # When `terraform init` fails, `terraform validate` does not run, so the outputs come from the command that failed.
  stdout:
    value: ${{ steps.init.outcome == 'failure' && steps.init.outputs.stdout || steps.validate.outputs.stdout }}
    description: "The STDOUT stream of the call to `terraform validate`, or to `terraform init` when it failed. Empty when skipped."
  stderr:
    value: ${{ steps.init.outcome == 'failure' && steps.init.outputs.stderr || steps.validate.outputs.stderr }}
    description: "The STDERR stream of the call to `terraform validate`, or to `terraform init` when it failed. Empty when skipped."
  exitcode:
    value: ${{ steps.init.outcome == 'failure' && steps.init.outputs.exitcode || steps.validate.outputs.exitcode }}
    description: "The exit code of the call to `terraform validate`, or to `terraform init` when it failed. Empty when skipped. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Target
    id: target
    shell: bash
    env:
      TARGET_DIR: ${{ inputs.target_dir }}
    run: |
      target_dir="${TARGET_DIR%/}"
      target_dir="${target_dir:-.}"
      echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"

      # `terraform validate` reports an empty directory as valid, which would be a vacuous pass.
      if [ -z "$(find "$target_dir" -maxdepth 1 -type f \( -name '*.tf' -o -name '*.tf.json' \) -print -quit)" ]; then
        echo "::notice::Skipping terraform validate: no Terraform files in $target_dir."
        echo "skipped=true" >> "$GITHUB_OUTPUT"
      fi

  - name: Terraform Init
    id: init
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      TARGET_DIR: ${{ steps.target.outputs.target_dir }}
      WORKSPACE: ${{ inputs.workspace }}
    with:
      run: |
        if [ -n "$WORKSPACE" ]; then
          export TF_WORKSPACE="$WORKSPACE"
        fi

        terraform -chdir="$TARGET_DIR" init \
          -backend=false \
          -input=false \
          -no-color

  - name: Add Failure Details to Job Summary
    id: init-summary
    if: always() && steps.init.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ terraform init · ${{ inputs.target_dir }}${{ inputs.workspace && format(' ({0})', inputs.workspace) || '' }}"
      file: ${{ steps.init.outputs.log_file }}
      lang: text

  - name: Terraform Validate
    id: validate
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      TARGET_DIR: ${{ steps.target.outputs.target_dir }}
      WORKSPACE: ${{ inputs.workspace }}
      VALIDATE_TESTS: ${{ inputs.validate_tests }}
      TEST_DIRECTORY: ${{ inputs.test_directory }}
      VALIDATE_QUERY: ${{ inputs.validate_query }}
    with:
      run: |
        if [ -n "$WORKSPACE" ]; then
          export TF_WORKSPACE="$WORKSPACE"
        fi

        args=(-no-color)
        if [ "$VALIDATE_TESTS" != "true" ]; then
          args+=(-no-tests)
        elif [ -n "$TEST_DIRECTORY" ]; then
          args+=(-test-directory="$TEST_DIRECTORY")
        fi
        if [ "$VALIDATE_QUERY" = "true" ]; then
          args+=(-query)
        fi

        terraform -chdir="$TARGET_DIR" validate "${args[@]}"

  - name: Add Failure Details to Job Summary
    id: validate-summary
    if: always() && steps.validate.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ terraform validate · ${{ inputs.target_dir }}${{ inputs.workspace && format(' ({0})', inputs.workspace) || '' }}"
      file: ${{ steps.validate.outputs.log_file }}
      lang: text
