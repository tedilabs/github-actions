name: Terraform - Changed Workspaces
description: Resolve changed directories to the Terraform projects and workspaces that need to be checked, for use as a job matrix.


inputs:
  directories:
    required: true
    description: "(Required) A JSON array of changed directories, typically the `directories` output of the `git.changed-dirs` action."
  project_marker_file:
    required: false
    default: versions.tf
    description: "(Optional) The file that identifies a Terraform project directory. Each changed directory is resolved to the nearest directory, itself or an ancestor, that contains this file. Directories without one are skipped. Defaults to `versions.tf`."
  project_mode:
    required: false
    default: auto
    description: "(Optional) How a project maps to workspaces. `single-workspace` treats the project directory itself as the only workspace and never scans its subdirectories. `multi-workspace` treats subdirectories of the project as its workspaces. `auto` decides per project: a project holding `workspace_marker_file` is `single-workspace`, anything else is `multi-workspace`. Defaults to `auto`."
  workspace_marker_file:
    required: false
    default: config.yaml
    description: "(Optional) The file that identifies a workspace. In `multi-workspace` mode, only the subdirectories holding it are workspaces, which keeps shared directories out of the matrix without listing them. When no subdirectory holds it, the mode falls back to `workspace_exclude_dirs`. Set to an empty string to always use `workspace_exclude_dirs`. Defaults to `config.yaml`."
  workspace_exclude_dirs:
    required: false
    default: common,policies,files
    description: "(Optional) A comma-separated list of subdirectory names that are not workspaces. Only used in `multi-workspace` mode when `workspace_marker_file` finds nothing, where every other non-hidden subdirectory is treated as a workspace. Hidden directories such as `.terraform` are always excluded. Defaults to `common,policies,files`."

outputs:
  has_targets:
    value: ${{ steps.resolve.outputs.has_targets }}
    description: "Whether `targets` is non-empty. `true` or `false`."
  targets:
    value: ${{ steps.resolve.outputs.targets }}
    description: "A JSON array of `{\"project\": ..., \"workspace\": ...}` objects for `strategy.matrix.include`. A single-workspace project yields one target with an empty `workspace`. For a multi-workspace project, a change under `<project>/<workspace>/` targets that workspace only, and any other change under `<project>/` targets every workspace of the project."


runs:
  using: composite

  steps:
  - name: Resolve Projects and Workspaces
    id: resolve
    shell: bash
    env:
      DIRECTORIES: ${{ inputs.directories }}
      PROJECT_MARKER_FILE: ${{ inputs.project_marker_file }}
      PROJECT_MODE: ${{ inputs.project_mode }}
      WORKSPACE_MARKER_FILE: ${{ inputs.workspace_marker_file }}
      WORKSPACE_EXCLUDE_DIRS: ${{ inputs.workspace_exclude_dirs }}
    run: |
      case "$PROJECT_MODE" in
        auto|single-workspace|multi-workspace) ;;
        *)
          echo "::error::Invalid project_mode: $PROJECT_MODE. Valid values are auto, single-workspace, or multi-workspace."
          exit 1
          ;;
      esac

      IFS=',' read -ra exclude_dirs <<< "$WORKSPACE_EXCLUDE_DIRS"

      is_excluded() {
        local name="$1" excluded
        for excluded in "${exclude_dirs[@]}"; do
          excluded="${excluded// /}"
          if [ -n "$excluded" ] && [ "$excluded" = "$name" ]; then
            return 0
          fi
        done
        return 1
      }

      # Subdirectories holding the workspace marker. Hidden ones never match, as `*/` skips them.
      list_marked_workspaces() {
        local project="$1" path
        shopt -s nullglob
        [ -n "$WORKSPACE_MARKER_FILE" ] || return 0
        for path in "$project"/*/; do
          [ -f "$path/$WORKSPACE_MARKER_FILE" ] && basename "$path"
        done
        return 0
      }

      # Fallback for projects that do not mark their workspaces: every non-excluded subdirectory.
      list_remaining_workspaces() {
        local project="$1" path name
        shopt -s nullglob
        for path in "$project"/*/; do
          name="$(basename "$path")"
          is_excluded "$name" || echo "$name"
        done
        return 0
      }

      # Prints one workspace name per line. No output means the project itself is the only workspace.
      list_workspaces() {
        local project="$1" mode="$PROJECT_MODE" marked

        if [ "$mode" = "auto" ]; then
          if [ -n "$WORKSPACE_MARKER_FILE" ] && [ -f "$project/$WORKSPACE_MARKER_FILE" ]; then
            mode="single-workspace"
          else
            mode="multi-workspace"
          fi
        fi

        [ "$mode" = "single-workspace" ] && return 0

        marked="$(list_marked_workspaces "$project")"
        if [ -n "$marked" ]; then
          printf '%s\n' "$marked"
        else
          list_remaining_workspaces "$project"
        fi
      }

      targets="[]"
      add_target() {
        targets="$(jq -c --arg project "$1" --arg workspace "$2" '. + [{project: $project, workspace: $workspace}] | unique' <<< "$targets")"
      }

      while IFS= read -r dir; do
        [ -z "$dir" ] && continue

        # Walk up from the changed directory to the nearest directory containing the project marker file.
        project=""
        current="$dir"
        while :; do
          if [ -f "$current/$PROJECT_MARKER_FILE" ]; then
            project="$current"
            break
          fi
          [ "$current" = "." ] && break
          current="$(dirname "$current")"
        done

        if [ -z "$project" ]; then
          echo "Skipping $dir: no $PROJECT_MARKER_FILE in the directory or its parents."
          continue
        fi

        workspaces=()
        while IFS= read -r name; do
          [ -n "$name" ] && workspaces+=("$name")
        done < <(list_workspaces "$project")

        if [ "${#workspaces[@]}" -eq 0 ]; then
          echo "$dir -> $project (the project is the workspace)"
          add_target "$project" ""
          continue
        fi

        # The first path segment below the project decides the scope.
        if [ "$project" = "." ]; then
          relative="$dir"
          [ "$relative" = "." ] && relative=""
        else
          relative="${dir#"$project"}"
          relative="${relative#/}"
        fi
        first="${relative%%/*}"

        if [ -n "$first" ] && printf '%s\n' "${workspaces[@]}" | grep -qxF -- "$first"; then
          echo "$dir -> $project / $first"
          add_target "$project" "$first"
        else
          echo "$dir -> $project (all workspaces: ${workspaces[*]})"
          for name in "${workspaces[@]}"; do
            add_target "$project" "$name"
          done
        fi
      done < <(jq -r '.[]' <<< "${DIRECTORIES:-[]}")

      if [ "$(jq 'length' <<< "$targets")" -gt 0 ]; then
        has_targets=true
      else
        has_targets=false
      fi

      echo "Targets: $targets"
      echo "has_targets=$has_targets" >> "$GITHUB_OUTPUT"
      echo "targets=$targets" >> "$GITHUB_OUTPUT"
