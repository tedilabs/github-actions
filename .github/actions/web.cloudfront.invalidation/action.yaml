name: Web - CloudFront Cache Invalidation
description: Invalidate AWS CloudFront distribution cache.


inputs:
  aws_region:
    required: false
    default: us-east-1
    description: "(Optional) The region of the AWS. CloudFront is a global service but the API endpoint is in `us-east-1`. Defaults to `us-east-1`."
  aws_access_key_id:
    required: false
    description: "(Optional) The access key ID used to authenticate to the AWS."
  aws_secret_access_key:
    required: false
    description: "(Optional) The secret access key used to authenticate to the AWS."
  aws_github_oidc_iam_role:
    required: false
    description: "(Optional) The ARN (Amazon Resource Name) of the IAM role to assume via GitHub OIDC to authenticate."
  aws_github_oidc_session_name:
    required: false
    default: GitHubActions
    description: "(Optional) The identifier for the assumed role session via GitHub OIDC. Defaults to `GitHubActions`."
  aws_github_oidc_audience:
    required: false
    default: sts.amazonaws.com
    description: "(Optional) The OIDC audience to be specified when the JWT is created. Defaults to `sts.amazonaws.com`. This will work for most cases. Changing the default audience may be necessary when using non-default AWS partitions, such as China regions."
  aws_chained_iam_role:
    required: false
    description: "(Optional) The ARN of the chained IAM role to assume after assuming the GitHub OIDC IAM role or after configuring AWS credentials with access key and secret access key."
  aws_chained_session_name:
    required: false
    default: GitHubActions
    description: "(Optional) The identifier for the assumed role session when assuming the chained IAM role. Defaults to `GitHubActions`."

  aws_cloudfront_distribution_id:
    required: true
    description: "(Required) The ID of the AWS CloudFront distribution to invalidate cache for. For example, `E1234567890ABC`."
  aws_cloudfront_invalidation_paths:
    required: false
    default: "/*"
    description: "(Optional) Comma-separated list of paths to invalidate in the CloudFront distribution cache. Defaults to `/*`, which invalidates the entire cache. You can specify specific paths like `/index.html,/about.html`."
  aws_cloudfront_invalidation_wait:
    required: false
    default: "true"
    description: "(Optional) Whether to wait for the invalidation to complete. Defaults to `true`. If set to `false`, the action will not wait for the invalidation to complete and will exit immediately after creating the invalidation request."

outputs:
  invalidation_id:
    value: ${{ steps.invalidate-cache.outputs.invalidation_id }}
    description: "The ID of the CloudFront invalidation that was created."
  invalidation_paths:
    value: ${{ steps.invalidate-cache.outputs.invalidation_paths }}
    description: "The paths that were invalidated in the CloudFront distribution."
  distribution_id:
    value: ${{ steps.invalidate-cache.outputs.distribution_id }}
    description: "The ID of the CloudFront distribution that was invalidated."


runs:
  using: composite

  steps:
  - name: Configure AWS Credentials
    id: configure-aws-credentials
    uses: tedilabs/github-actions/.github/actions/aws.configure-credentials@main
    with:
      aws_region: ${{ inputs.aws_region }}
      aws_access_key_id: ${{ inputs.aws_access_key_id }}
      aws_secret_access_key: ${{ inputs.aws_secret_access_key }}
      aws_github_oidc_iam_role: ${{ inputs.aws_github_oidc_iam_role }}
      aws_github_oidc_session_name: ${{ inputs.aws_github_oidc_session_name }}
      aws_github_oidc_audience: ${{ inputs.aws_github_oidc_audience }}
      aws_chained_iam_role: ${{ inputs.aws_chained_iam_role }}
      aws_chained_session_name: ${{ inputs.aws_chained_session_name }}

  - name: Invalidate CloudFront Cache
    id: invalidate-cache
    shell: bash
    run: |
      # Disable glob expansion so wildcard paths like `/*` are passed to
      # CloudFront literally instead of expanding to runner filesystem entries.
      set -f

      input="${{ inputs.aws_cloudfront_invalidation_paths }}"

      input_paths=$(echo "$input" | sed 's/[[:space:]]*,[[:space:]]*/ /g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

      INVALIDATION_ID=$(aws cloudfront create-invalidation \
        --distribution-id ${{ inputs.aws_cloudfront_distribution_id }} \
        --paths $input_paths \
        --query 'Invalidation.Id' \
        --output text)

      echo "Created invalidation: $INVALIDATION_ID"
      echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
      echo "invalidation_paths=$input_paths" >> "$GITHUB_OUTPUT"
      echo "distribution_id=${{ inputs.aws_cloudfront_distribution_id }}" >> "$GITHUB_OUTPUT"

      if [ "${{ inputs.aws_cloudfront_invalidation_wait }}" = "true" ]; then
        echo "Waiting for invalidation to complete..."
        aws cloudfront wait invalidation-completed \
          --distribution-id ${{ inputs.aws_cloudfront_distribution_id }} \
          --id "$INVALIDATION_ID"
        echo "Invalidation completed successfully"
      else
        echo "Skipping wait for invalidation completion (aws_cloudfront_invalidation_wait=false)"
      fi
