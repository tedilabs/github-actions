name: GitHub Actions - actionlint
description: Lint GitHub Actions workflow files with `actionlint`. On failure, the findings are added to the job summary. Requires the `actionlint` CLI on the `PATH`. When `shellcheck` is also on the `PATH`, `run` scripts are checked with it.


inputs:
  target_dir:
    required: false
    default: .github/workflows
    description: "(Optional) The directory holding the workflow files to lint. Only the `*.yml` and `*.yaml` files directly in it are linted, since GitHub only reads top-level workflow files. Defaults to `.github/workflows`."
  config_file:
    required: false
    description: "(Optional) The path to the `actionlint` config file, relative to the repository root. When omitted, `actionlint` discovers `.github/actionlint.yaml` in the Git repository that holds the workflow files as usual; files outside a Git repository are linted without a config."
  shellcheck_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to check `run` scripts with `shellcheck`. Requires the `shellcheck` CLI on the `PATH`. Defaults to `true`."
  annotations_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to annotate the reported lines in the pull request when `actionlint` fails, by re-running it with a JSON format and turning each finding into a workflow error. Defaults to `true`."

outputs:
  skipped:
    value: ${{ steps.target.outputs.skipped }}
    description: "`true` when `target_dir` holds no workflow files and `actionlint` was not run. Empty otherwise."
  stdout:
    value: ${{ steps.actionlint.outputs.stdout }}
    description: "The STDOUT stream of the call to `actionlint`. Empty when skipped."
  stderr:
    value: ${{ steps.actionlint.outputs.stderr }}
    description: "The STDERR stream of the call to `actionlint`. Empty when skipped."
  exitcode:
    value: ${{ steps.actionlint.outputs.exitcode }}
    description: "The exit code of the call to `actionlint`. Empty when skipped. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Targets
    id: target
    shell: bash
    env:
      TARGET_DIR: ${{ inputs.target_dir }}
      CONFIG_FILE: ${{ inputs.config_file }}
    run: |
      target_dir="${TARGET_DIR%/}"
      target_dir="${target_dir:-.}"
      echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"

      # `actionlint` exits 3 when it finds no workflows directory, so an empty or missing target is skipped instead
      # of failing; `find` would fail on a missing directory too.
      files=""
      if [ -d "$target_dir" ]; then
        files=$(find "$target_dir" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
      fi
      if [ -z "$files" ]; then
        echo "::notice::Skipping actionlint: no workflow files in $target_dir."
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        exit 0
      fi

      delimiter="$(head -c 15 /dev/urandom | base64)"
      printf 'files<<%s\n%s\n%s\n' "$delimiter" "$files" "$delimiter" >> "$GITHUB_OUTPUT"

      if [ -n "$CONFIG_FILE" ]; then
        echo "config=$(realpath "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
      fi

      actionlint -version | head -n 1

  - name: Run actionlint
    id: actionlint
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      FILES: ${{ steps.target.outputs.files }}
      CONFIG: ${{ steps.target.outputs.config }}
      SHELLCHECK_ENABLED: ${{ inputs.shellcheck_enabled }}
    with:
      run: |
        args=(-no-color)
        if [ -n "$CONFIG" ]; then
          args+=(-config-file "$CONFIG")
        fi
        if [ "$SHELLCHECK_ENABLED" != "true" ]; then
          args+=(-shellcheck=)
        fi

        # The files are passed explicitly; `actionlint` still discovers the config from the Git repository that holds them.
        readarray -t files <<< "$FILES"
        actionlint "${args[@]}" "${files[@]}"

  # GitHub only renders annotations from `::error` lines, so the findings are re-read as JSON. The files are passed
  # repository-relative, and `actionlint` reports them as given.
  - name: Annotate Findings
    id: actionlint-annotate
    if: always() && inputs.annotations_enabled == 'true' && steps.actionlint.outcome == 'failure'
    shell: bash
    env:
      FILES: ${{ steps.target.outputs.files }}
      CONFIG: ${{ steps.target.outputs.config }}
      SHELLCHECK_ENABLED: ${{ inputs.shellcheck_enabled }}
    run: |
      args=(-no-color -format '{{json .}}')
      if [ -n "$CONFIG" ]; then
        args+=(-config-file "$CONFIG")
      fi
      if [ "$SHELLCHECK_ENABLED" != "true" ]; then
        args+=(-shellcheck=)
      fi

      # A workflow command takes one line, so newlines and the property separators are percent-encoded the way
      # the runner decodes them.
      readarray -t files <<< "$FILES"
      actionlint "${args[@]}" "${files[@]}" 2>/dev/null | jq -r '
        def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
        def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
        .[]
        | "::error file=\(.filepath),line=\(.line),col=\(.column)\(if (.end_column // 0) > 0 then ",endColumn=\(.end_column)" else "" end),title=\("actionlint · " + .kind | prop)::\(.message | esc)"
      ' || true

  - name: Add Failure Details to Job Summary
    id: actionlint-summary
    if: always() && steps.actionlint.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ actionlint · ${{ steps.target.outputs.target_dir }}"
      file: ${{ steps.actionlint.outputs.log_file }}
      lang: text
