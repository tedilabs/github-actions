name: GitHub Actions - actionlint
description: Lint GitHub Actions workflow files with `actionlint`. On failure, the findings are added to the job summary. Requires the `actionlint` CLI on the `PATH`. When `shellcheck` is also on the `PATH`, `run` scripts are checked with it.


inputs:
  target_dir:
    required: false
    default: ./
    description: "(Optional) The repository root to lint. `actionlint` finds the `.github/workflows` directory from there. Defaults to `./`."
  config_file:
    required: false
    description: "(Optional) The path to the `actionlint` config file, relative to the repository root. When omitted, `actionlint` discovers `.github/actionlint.yaml` as usual."
  shellcheck_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to check `run` scripts with `shellcheck`. Requires the `shellcheck` CLI on the `PATH`. Defaults to `true`."

outputs:
  stdout:
    value: ${{ steps.actionlint.outputs.stdout }}
    description: "The STDOUT stream of the call to `actionlint`."
  stderr:
    value: ${{ steps.actionlint.outputs.stderr }}
    description: "The STDERR stream of the call to `actionlint`."
  exitcode:
    value: ${{ steps.actionlint.outputs.exitcode }}
    description: "The exit code of the call to `actionlint`. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Options
    id: target
    shell: bash
    env:
      CONFIG_FILE: ${{ inputs.config_file }}
    run: |
      # `actionlint` runs inside `target_dir`, so make the config path absolute here.
      if [ -n "$CONFIG_FILE" ]; then
        echo "config=$(realpath "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
      fi

      actionlint -version | head -n 1

  - name: Run actionlint
    id: actionlint
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      CONFIG: ${{ steps.target.outputs.config }}
      SHELLCHECK_ENABLED: ${{ inputs.shellcheck_enabled }}
    with:
      working_directory: ${{ inputs.target_dir }}
      run: |
        args=(-no-color)
        if [ -n "$CONFIG" ]; then
          args+=(-config-file "$CONFIG")
        fi
        if [ "$SHELLCHECK_ENABLED" != "true" ]; then
          args+=(-shellcheck=)
        fi

        actionlint "${args[@]}"

  - name: Add Failure Details to Job Summary
    id: actionlint-summary
    if: always() && steps.actionlint.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ actionlint · ${{ inputs.target_dir }}"
      file: ${{ steps.actionlint.outputs.log_file }}
      lang: text
