name: GitHub Actions - actionlint
description: Lint GitHub Actions workflow files with `jactionlint`, an actively maintained fork of `actionlint`. On failure, the findings are added to the job summary. Requires the `jactionlint` CLI on the `PATH`. When `shellcheck` is also on the `PATH`, `run` scripts are checked with it.


inputs:
  target_dir:
    required: false
    default: .github/workflows
    description: "(Optional) The directory holding the workflow files to lint. Only the `*.yml` and `*.yaml` files directly in it are linted, since GitHub only reads top-level workflow files. Defaults to `.github/workflows`."
  config_file:
    required: false
    description: "(Optional) The path to the `jactionlint` config file, relative to the repository root. When omitted, `jactionlint` discovers `.github/jactionlint.yaml`, or the `.github/actionlint.yaml` of the original `actionlint`, in the Git repository that holds the workflow files; files outside a Git repository are linted without a config."
  profile:
    required: false
    default: correctness
    description: "(Optional) The `jactionlint` rule profile: `correctness` (the checks of the original `actionlint`), `default` or `pedantic`. Overrides the profile of the config file. Defaults to `correctness`."
  shellcheck_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to check `run` scripts with `shellcheck`. Requires the `shellcheck` CLI on the `PATH`. Defaults to `true`."
  annotations_enabled:
    required: false
    default: "true"
    description: "(Optional) Whether to annotate the reported lines in the pull request when `jactionlint` fails, by re-running it with the JSON format and turning each finding into a workflow command of its severity. Defaults to `true`."

outputs:
  skipped:
    value: ${{ steps.target.outputs.skipped }}
    description: "`true` when `target_dir` holds no workflow files and `jactionlint` was not run. Empty otherwise."
  stdout:
    value: ${{ steps.actionlint.outputs.stdout }}
    description: "The STDOUT stream of the call to `jactionlint`. Empty when skipped."
  stderr:
    value: ${{ steps.actionlint.outputs.stderr }}
    description: "The STDERR stream of the call to `jactionlint`. Empty when skipped."
  exitcode:
    value: ${{ steps.actionlint.outputs.exitcode }}
    description: "The exit code of the call to `jactionlint`. Empty when skipped. The action still fails on a non-zero exit code, so use `continue-on-error: true` to inspect it."


runs:
  using: composite

  steps:
  - name: Resolve Targets
    id: target
    shell: bash
    env:
      TARGET_DIR: ${{ inputs.target_dir }}
      CONFIG_FILE: ${{ inputs.config_file }}
    run: |
      target_dir="${TARGET_DIR%/}"
      target_dir="${target_dir:-.}"
      echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"

      # An empty or missing target is skipped instead of failing; `find` would fail on a missing directory too.
      files=""
      if [ -d "$target_dir" ]; then
        files=$(find "$target_dir" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
      fi
      if [ -z "$files" ]; then
        echo "::notice::Skipping actionlint: no workflow files in $target_dir."
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        exit 0
      fi

      delimiter="$(head -c 15 /dev/urandom | base64)"
      printf 'files<<%s\n%s\n%s\n' "$delimiter" "$files" "$delimiter" >> "$GITHUB_OUTPUT"

      if [ -n "$CONFIG_FILE" ]; then
        echo "config=$(realpath "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
      fi

      jactionlint --version | head -n 1

  - name: Run jactionlint
    id: actionlint
    if: steps.target.outputs.skipped != 'true'
    uses: tedilabs/github-actions/.github/actions/shell.run@main
    env:
      FILES: ${{ steps.target.outputs.files }}
      CONFIG: ${{ steps.target.outputs.config }}
      PROFILE: ${{ inputs.profile }}
      SHELLCHECK_ENABLED: ${{ inputs.shellcheck_enabled }}
    with:
      run: |
        args=(--no-color "--profile=$PROFILE")
        if [ -n "$CONFIG" ]; then
          args+=("--config-file=$CONFIG")
        fi
        if [ "$SHELLCHECK_ENABLED" != "true" ]; then
          args+=(--shellcheck=)
        fi

        # The files are passed explicitly; `jactionlint` still discovers the config from the Git repository that holds them.
        readarray -t files <<< "$FILES"
        jactionlint "${args[@]}" "${files[@]}"

  # GitHub only renders annotations from workflow commands, so the findings are re-read as JSON. The files are passed
  # repository-relative, and `jactionlint` reports them as given.
  - name: Annotate Findings
    id: actionlint-annotate
    if: always() && inputs.annotations_enabled == 'true' && steps.actionlint.outcome == 'failure'
    shell: bash
    env:
      FILES: ${{ steps.target.outputs.files }}
      CONFIG: ${{ steps.target.outputs.config }}
      PROFILE: ${{ inputs.profile }}
      SHELLCHECK_ENABLED: ${{ inputs.shellcheck_enabled }}
    run: |
      args=(--no-color --format=json "--profile=$PROFILE")
      if [ -n "$CONFIG" ]; then
        args+=("--config-file=$CONFIG")
      fi
      if [ "$SHELLCHECK_ENABLED" != "true" ]; then
        args+=(--shellcheck=)
      fi

      # A workflow command takes one line, so newlines and the property separators are percent-encoded the way
      # the runner decodes them.
      readarray -t files <<< "$FILES"
      jactionlint "${args[@]}" "${files[@]}" 2>/dev/null | jq -r '
        def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
        def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
        .[]
        | ({"error": "error", "warn": "warning"}[.severity] // "notice") as $command
        | "::\($command) file=\(.filepath),line=\(.line),col=\(.column)\(if (.end_column // 0) > 0 then ",endColumn=\(.end_column)" else "" end),title=\("jactionlint · " + (.id // .kind) | prop)::\(.message | esc)"
      ' || true

  - name: Add Failure Details to Job Summary
    id: actionlint-summary
    if: always() && steps.actionlint.outcome == 'failure'
    uses: tedilabs/github-actions/.github/actions/github.step-summary@main
    with:
      title: "❌ jactionlint · ${{ steps.target.outputs.target_dir }}"
      file: ${{ steps.actionlint.outputs.log_file }}
      lang: text
